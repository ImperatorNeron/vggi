<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGW</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./models/Wellenkugel.js"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
    <script src="./models/DataStructures.js"></script>
</head>

<body onload="init()">
    <header>
        <h1>Surface of Revolution “Wellenkugel” (Variant 9)</h1>
        <p id="message">Drag your mouse on the cube to rotate it.<br>
            (On a touch screen, you can use your finger.)</p>
    </header>
    <div class="container">


        <section id="canvas-holder">
            <canvas width="1800" height="1800" id="webglcanvas" class="canvas"></canvas>
            <section id="sliders">
                <div class="option">Granularity</div>
                <div>
                    <label for="uSlider">U:</label>
                    <input type="range" id="uSlider" min="20" max="100" value="50" step="1" />
                    <span id="uValue">50</span>
                </div>
                <div>
                    <label for="vSlider">V:</label>
                    <input type="range" id="vSlider" min="20" max="100" value="50" step="1" />
                    <span id="vValue">50</span>
                </div>
                <div class="option">Scale</div>
                <div>
                    <label for="scaleSlider">Scale:</label>
                    <input type="range" id="scaleSlider" min="0.1" max="5.0" value="1.00" step="0.05" />
                    <span id="scaleValue">1.00</span>
                </div>
                <div>
                    <label for="uOffsetSlider">U:</label>
                    <input type="range" id="uOffsetSlider" min="0" max="1" value="0.50" step="0.01" />
                    <span id="uOffsetValue">0.50</span>
                </div>
                <div>
                    <label for="vOffsetSlider">V:</label>
                    <input type="range" id="vOffsetSlider" min="0" max="1" value="0.50" step="0.01" />
                    <span id="vOffsetValue">0.50</span>
                </div>
            </section>
        </section>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
